<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINWOWN – TICKETING ASSISTANCE</title>
<style>
  :root{
    --purple:#6632ad;
    --purple-2:#8b57d0;
    --pink:#e94d91;
    --lavender:#eee4ff;
    --soft:#fff9ff;
    --ink:#211743;
    --border:#d9c3f1;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    min-height:100vh;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 10% 15%, rgba(232,184,255,.35) 0 5px, transparent 6px),
      radial-gradient(circle at 90% 75%, rgba(255,160,213,.3) 0 5px, transparent 6px),
      linear-gradient(145deg,#fffaff 0%,#f6efff 48%,#fff5fb 100%);
  }
  .section{
    position:relative;
    overflow:hidden;
    padding:72px 20px 64px;
  }
  .sparkles,.hearts{position:absolute;inset:0;pointer-events:none}
  .sparkles span,.hearts span{
    position:absolute;
    opacity:.55;
    animation:float 5s ease-in-out infinite;
    user-select:none;
  }
  .sparkles span{color:#8a55c7;font-size:22px}
  .hearts span{color:#e95b9d;font-size:22px}
  .sparkles span:nth-child(1){left:7%;top:16%}
  .sparkles span:nth-child(2){right:9%;top:25%;animation-delay:1s}
  .sparkles span:nth-child(3){left:4%;bottom:18%;animation-delay:2s}
  .sparkles span:nth-child(4){right:5%;bottom:12%;animation-delay:3s}
  .hearts span:nth-child(1){left:14%;top:35%;animation-delay:.5s}
  .hearts span:nth-child(2){right:13%;top:52%;animation-delay:2.2s}
  .hearts span:nth-child(3){left:11%;bottom:10%;animation-delay:1.5s}
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-7px) rotate(4deg)}
  }

  .wrap{max-width:1220px;margin:0 auto;position:relative;z-index:1}
  .heading{text-align:center;margin-bottom:28px}
  .eyebrow{
    display:inline-block;
    padding:8px 18px;
    border:1px solid var(--border);
    border-radius:999px;
    background:rgba(255,255,255,.72);
    color:var(--purple);
    font-size:.78rem;
    font-weight:800;
    letter-spacing:.12em;
    text-transform:uppercase;
    box-shadow:0 5px 18px rgba(94,46,140,.08);
  }
  h1{
    margin:14px 0 8px;
    font-size:clamp(2rem,5vw,4rem);
    line-height:1;
    font-weight:900;
    letter-spacing:.02em;
    color:var(--purple);
    text-shadow:0 3px 0 #fff, 0 6px 16px rgba(101,47,166,.13);
  }
  h1 span{color:var(--pink)}
  .subtitle{
    margin:0;
    color:#71558f;
    font-size:clamp(.95rem,2vw,1.15rem);
    font-weight:700;
  }

  .slider-shell{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .nav{
    flex:0 0 54px;
    width:54px;height:54px;
    border:1px solid rgba(255,255,255,.9);
    border-radius:50%;
    background:linear-gradient(145deg,#a77be1,#6836b1);
    color:#fff;
    font-size:28px;
    font-weight:900;
    display:grid;
    place-items:center;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(89,44,139,.2), inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .18s ease, box-shadow .18s ease;
    z-index:3;
  }
  .nav:hover{transform:scale(1.07);box-shadow:0 13px 27px rgba(89,44,139,.25)}
  .nav:active{transform:scale(.94)}
  .nav:focus-visible{outline:3px solid #f29bc3;outline-offset:3px}

  .stage{
    min-width:0;
    flex:1;
  }
  .slide-title-wrap{
    text-align:center;
    min-height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .slide-title{
    margin:0;
    font-size:clamp(1.1rem,2.3vw,1.65rem);
    color:var(--purple);
    font-weight:900;
    letter-spacing:.025em;
    text-shadow:0 2px 0 #fff;
  }
  .counter{
    display:inline-block;
    margin-left:8px;
    padding:5px 10px;
    border-radius:999px;
    background:#f0e6ff;
    color:#7441b6;
    font-size:.75em;
    vertical-align:middle;
    white-space:nowrap;
  }
  .frame{
    position:relative;
    width:100%;
    aspect-ratio:3 / 2;
    background:rgba(255,255,255,.82);
    border:2px solid var(--border);
    border-radius:28px;
    padding:10px;
    box-shadow:0 18px 45px rgba(94,47,139,.13), 0 3px 0 rgba(255,255,255,.8) inset;
    overflow:hidden;
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .frame:hover{
    transform:translateY(-3px);
    box-shadow:0 23px 50px rgba(94,47,139,.16), 0 3px 0 rgba(255,255,255,.8) inset;
  }
  .frame img{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    border-radius:20px;
    user-select:none;
    -webkit-user-drag:none;
  }
  .anim-out-left{animation:outLeft .58s cubic-bezier(.22,.75,.25,1) both}
  .anim-out-right{animation:outRight .58s cubic-bezier(.22,.75,.25,1) both}
  .anim-in-right{animation:inRight .62s cubic-bezier(.22,.75,.25,1) both}
  .anim-in-left{animation:inLeft .62s cubic-bezier(.22,.75,.25,1) both}
  @keyframes outLeft{to{opacity:0;transform:translateX(-26px) scale(.985)}}
  @keyframes outRight{to{opacity:0;transform:translateX(26px) scale(.985)}}
  @keyframes inRight{from{opacity:0;transform:translateX(26px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes inLeft{from{opacity:0;transform:translateX(-26px) scale(.97)}to{opacity:1;transform:none}}

  .dots{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:9px;
    margin:18px 0 10px;
  }
  .dot{
    width:9px;height:9px;
    padding:0;border:0;border-radius:50%;
    background:#cbb0e9;
    cursor:pointer;
    transition:all .25s ease;
  }
  .dot.active{
    width:28px;
    border-radius:999px;
    background:linear-gradient(90deg,#8a4ed0,#ef5c9d);
    box-shadow:0 4px 10px rgba(221,79,143,.22);
  }
  .dot:focus-visible{outline:2px solid #7c46ba;outline-offset:3px}

  .progress{
    width:min(440px,72%);
    height:4px;
    margin:0 auto 30px;
    background:#eadcf7;
    border-radius:999px;
    overflow:hidden;
  }
  .progress i{
    display:block;height:100%;width:16.6667%;
    background:linear-gradient(90deg,#7950c3,#ec5a9b);
    transform-origin:left center;
  }
  .progress.running i{animation:progress 6s linear forwards}
  @keyframes progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  .footer{
    text-align:center;
    margin-top:22px;
    padding:24px 18px;
    border:1px solid var(--border);
    border-radius:24px;
    background:rgba(255,255,255,.65);
    box-shadow:0 10px 28px rgba(95,49,139,.08);
  }
  .footer p{margin:0 0 8px;color:#6b4c8e;font-weight:700}
  .brand{
    margin:0;
    color:var(--purple);
    font-size:clamp(1rem,2vw,1.25rem);
    font-weight:900;
    letter-spacing:.06em;
  }
  .brand::before,.brand::after{content:" ♥ ";color:var(--pink)}
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }

  @media (max-width:700px){
    .section{padding:48px 10px 42px}
    .slider-shell{gap:7px}
    .nav{flex-basis:42px;width:42px;height:42px;font-size:22px}
    .frame{border-radius:19px;padding:6px}
    .frame img{border-radius:14px}
    .slide-title-wrap{min-height:74px;padding:0 3px}
    .slide-title{line-height:1.25}
    .counter{display:block;width:max-content;margin:6px auto 0}
    .footer{border-radius:19px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<section class="section" aria-labelledby="section-title">
  <div class="sparkles" aria-hidden="true">
    <span>✦</span><span>✧</span><span>✦</span><span>✧</span>
  </div>
  <div class="hearts" aria-hidden="true">
    <span>♥</span><span>♥</span><span>♡</span>
  </div>

  <div class="wrap">
    <header class="heading">
      <div class="eyebrow">Minwown Information Center</div>
      <h1 id="section-title">MINWOWN <span>– TICKETING ASSISTANCE</span></h1>
      <p class="subtitle">Terms, Guidelines &amp; How It Works</p>
    </header>

    <div class="slider-shell" id="slider" aria-roledescription="carousel" aria-label="Minwown ticketing assistance information">
      <button class="nav" id="prev" type="button" aria-label="Previous slide">‹</button>

      <div class="stage">
        <div class="slide-title-wrap" aria-live="polite">
          <h2 class="slide-title" id="slideTitle"></h2>
        </div>

        <div class="frame" id="frame">
          <img id="slideImage" src="images/slide-1.png" alt="Terms & Conditions Overview infographic for Minwown Ticketing Assistance" draggable="false">
        </div>

        <div class="dots" id="dots" aria-label="Choose a slide"></div>
        <div class="progress" id="progress" aria-hidden="true"><i></i></div>
      </div>

      <button class="nav" id="next" type="button" aria-label="Next slide">›</button>
    </div>

    <footer class="footer">
      <p>Please read the guidelines carefully before submitting your order. 💗</p>
      <p class="brand">MINWOWN – TICKETING ASSISTANCE</p>
    </footer>
  </div>
</section>

<script>
const slides = [
  {title:"Terms & Conditions Overview", file:"images/slide-1.png", alt:"Terms & Conditions Overview infographic for Minwown Ticketing Assistance"},
  {title:"Slot Cancellation & Refund Guidelines", file:"images/slide-2.png", alt:"Slot Cancellation & Refund Guidelines infographic for Minwown Ticketing Assistance"},
  {title:"Frequently Asked Questions (FAQ)", file:"images/slide-3.png", alt:"Frequently Asked Questions infographic for Minwown Ticketing Assistance"},
  {title:"Important Transaction Guidelines", file:"images/slide-4.png", alt:"Important Transaction Guidelines infographic for Minwown Ticketing Assistance"},
  {title:"Additional FAQs", file:"images/slide-5.png", alt:"Additional FAQs infographic for Minwown Ticketing Assistance"},
  {title:"How Ticketing Works", file:"images/slide-6.png", alt:"How Ticketing Works infographic for Minwown Ticketing Assistance"}
];

let index = 0;
let busy = false;
let timer = null;
let touchStartX = 0, touchStartY = 0;

const img = document.getElementById("slideImage");
const title = document.getElementById("slideTitle");
const dots = document.getElementById("dots");
const progress = document.getElementById("progress");
const slider = document.getElementById("slider");

slides.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "dot" + (i === 0 ? " active" : "");
  b.type = "button";
  b.setAttribute("aria-label", `Go to slide ${i+1}: ${s.title}`);
  b.addEventListener("click", () => goTo(i, i > index ? 1 : -1));
  dots.appendChild(b);
});

function render(direction = 1, animate = false) {
  title.textContent = slides[index].title;
  title.setAttribute("aria-label", `${slides[index].title}, ${index+1} of ${slides.length}`);
  img.src = slides[index].file;
  img.alt = slides[index].alt;

  [...dots.children].forEach((d, i) => d.classList.toggle("active", i === index));
  progress.classList.remove("running");
  void progress.offsetWidth;
  progress.classList.add("running");

  if (animate) {
    const inClass = direction > 0 ? "anim-in-right" : "anim-in-left";
    title.classList.remove("anim-in-right","anim-in-left");
    void title.offsetWidth;
    title.classList.add(inClass);
    img.classList.remove("anim-in-right","anim-in-left");
    void img.offsetWidth;
    img.classList.add(inClass);
  }
}

function goTo(target, direction) {
  if (busy || target === index) return;
  busy = true;

  const outClass = direction > 0 ? "anim-out-left" : "anim-out-right";
  img.classList.remove("anim-out-left","anim-out-right","anim-in-right","anim-in-left");
  title.classList.remove("anim-out-left","anim-out-right","anim-in-right","anim-in-left");
  img.classList.add(outClass);
  title.classList.add(outClass);

  setTimeout(() => {
    index = (target + slides.length) % slides.length;
    img.classList.remove(outClass);
    title.classList.remove(outClass);
    render(direction, true);
    setTimeout(() => { busy = false; }, 620);
  }, 570);

  restartAutoplay();
}

function next(){ goTo((index + 1) % slides.length, 1); }
function prev(){ goTo((index - 1 + slides.length) % slides.length, -1); }

document.getElementById("next").addEventListener("click", next);
document.getElementById("prev").addEventListener("click", prev);

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { e.preventDefault(); next(); }
  if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
});

slider.addEventListener("touchstart", e => {
  touchStartX = e.changedTouches[0].clientX;
  touchStartY = e.changedTouches[0].clientY;
}, {passive:true});

slider.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) {
    dx < 0 ? next() : prev();
  }
}, {passive:true});

let hovering = false;
slider.addEventListener("mouseenter", () => { hovering = true; stopAutoplay(); });
slider.addEventListener("mouseleave", () => { hovering = false; restartAutoplay(); });

function startAutoplay(){
  clearInterval(timer);
  timer = setInterval(() => { if (!hovering && !busy) next(); }, 6000);
}
function stopAutoplay(){ clearInterval(timer); }
function restartAutoplay(){ startAutoplay(); }

render(1, false);
startAutoplay();
</script>
</body>
</html>
